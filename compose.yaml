services:
  # ========================================================
  # Aplicación PHP + servidor web (FrankenPHP)
  # ========================================================
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_php
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
      - "443:443/udp" # HTTP/3
    volumes:
      - ./:/app:cached            # Código en vivo (hot reload)
      - caddy_data:/data          # Certificados TLS
      - caddy_config:/config      # Configuración de Caddy
      # Habilitar la siguiente linea en producción
      # - ./docker/Caddyfile:/etc/frankenphp/Caddyfile:ro
    environment:
      SERVER_NAME: "https://localhost"
      # DATABASE_URL se lee desde .env / .env.local (no definir aquí)
      APP_ENV: dev
      APP_SECRET: "ChangeMe!ThisIsADevSecret"
      # Habilitar el modo worker de FrankenPHP solo en staging o prod (5x +rápido)
      # FRANKENPHP_CONFIG: "worker ./public/index.php"
    depends_on:
      database-postgresql:
        condition: service_healthy
        required: false
      database-mysql:
        condition: service_healthy
        required: false
      gotenberg:
        condition: service_healthy
    tty: true

  # ========================================================
  # Gotenberg — conversión HTML → PDF (Chromium)
  # ========================================================
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: app_gotenberg
    restart: unless-stopped
    ports:
      - "${GOTENBERG_PORT}:${GOTENBERG_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${GOTENBERG_PORT}/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ========================================================
  # PostgreSQL 18 (perfil: postgresql)
  # ========================================================
  database-postgresql:
    profiles: ["postgresql"]
    image: postgres:18.3-alpine
    container_name: app_db_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      # ⚠️ Postgres 18+: montar en /var/lib/postgresql (no .../data)
      - db_data_postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - database

  # ========================================================
  # MySQL 8.4 LTS (perfil: mysql)
  # ========================================================
  database-mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    container_name: app_db_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    ports:
      - "${DATABASE_PORT}:3306"
    volumes:
      - db_data_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DATABASE_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      default:
        aliases:
          - database

# ========================================================
# Volúmenes persistentes
# ========================================================
volumes:
  db_data_postgresql:
  db_data_mysql:
  caddy_data:
  caddy_config:
