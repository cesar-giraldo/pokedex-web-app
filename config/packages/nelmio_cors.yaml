nelmio_cors:
    defaults:
        allow_origin: []
        allow_methods: []
        allow_headers: []
        max_age: 0
        origin_regex: false
    paths:
        '^/api/':
            origin_regex: true
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
            allow_headers: ['Content-Type', 'Authorization', 'Accept']
            expose_headers: ['Link']
            max_age: 3600
