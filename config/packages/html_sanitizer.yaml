framework:
    html_sanitizer:
        sanitizers:
            legal:
                allow_elements:
                    h1: []
                    h2: []
                    h3: []
                    div: []
                    p: []
                    br: []
                    strong: []
                    em: []
                    ul: []
                    ol: []
                    li: []
                    blockquote: []
                    a: ['href', 'title', 'rel']
                allow_relative_links: true
                force_https_urls: false
                max_input_length: -1
