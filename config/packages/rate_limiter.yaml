framework:
    rate_limiter:
        public_registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        account_confirmation_resend:
            policy: sliding_window
            limit: 5
            interval: '2 hours'
        password_reset_request_ip:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        password_reset_request_identifier:
            policy: sliding_window
            limit: 3
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            public_registration:
                limit: 1000
                interval: '1 minute'
            account_confirmation_resend:
                limit: 1000
                interval: '1 minute'
            password_reset_request_ip:
                limit: 1000
                interval: '1 minute'
            password_reset_request_identifier:
                limit: 1000
                interval: '1 minute'
