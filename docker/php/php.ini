; Configuración PHP para desarrollo
date.timezone = UTC
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

; Mitigación adicional de CVE-2026-109619 hasta el siguiente bugfix de PHP.
; La aplicación no usa el progreso de subida en sesión.
session.upload_progress.enabled = 0

; Mostrar errores en desarrollo (NO usar en producción)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; OPcache (acelera PHP)
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0