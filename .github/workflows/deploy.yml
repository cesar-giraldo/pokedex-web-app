name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Deploy the tested commit over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${HOST}" || -z "${USER}" || -z "${SSH_KEY}" ]]; then
            echo "EC2_HOST, EC2_USER o EC2_SSH_KEY no están configurados. El despliegue queda pendiente."
            exit 0
          fi
          if [[ ! "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "El SHA del workflow no es un commit." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${USER}@${HOST}" \
            "set -euo pipefail; cd /srv/pokedex/src; git fetch origin main; git checkout --detach ${SHA}; ./deploy/deploy.sh"
